name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'car_rental_backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'car_rental_backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car_rental_backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: car_rental_backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Test Suites
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret_key_32_characters_long_12345
          JWT_REFRESH_SECRET: test_refresh_secret_key_32_characters_long_12345
          BANK_ENCRYPTION_KEY: test_bank_encryption_key_32_bytes_hex_1234567890abcdef1234567890abcdef
          REDIS_URL: redis://localhost:6379
          REDIS_USE_MOCK: 'false'
          SMS_PROVIDER: mock
          RAZORPAY_USE_MOCK: 'true'
          R2_USE_MOCK: 'true'

      - name: Build Backend Bundle
        run: npm run build
