name: customer_app
description: Customer application for car rental platform.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  core:
    path: ../../packages/core
  models:
    path: ../../packages/models
  mock_data:
    path: ../../packages/mock_data
  ui_kit:
    path: ../../packages/ui_kit
  gap: ^3.0.1
  google_fonts: ^8.1.0
  razorpay_flutter: ^1.4.5
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  dio: ^5.7.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
